# Free public preview. Upgrade both resources before accepting real orders.
databases:
  - name: eidren-db
    databaseName: eidren
    user: eidren
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: eidren-watch-store
    runtime: python
    plan: free
    region: oregon
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eidren-db
          property: connectionString
      - key: DATABASE_REQUIRE_SSL
        value: "true"
      - key: STORE_NAME
        value: EIDREN
      - key: STRIPE_AUTOMATIC_TAX
        value: "false"
      - key: SHIPPING_COUNTRIES
        value: US
      - key: SHIPPING_RATE_CENTS
        value: "0"
