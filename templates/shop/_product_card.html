<article class="product-card">
  <a class="product-image" href="{% url 'shop:product_detail' product.slug %}" aria-label="Discover {{ product.name }}">
    {% if product.is_demo %}<span class="product-tag">DESIGN STUDY</span>{% elif product.stock == 0 %}<span class="product-tag">SOLD OUT</span>{% elif product.is_featured %}<span class="product-tag">IN FOCUS</span>{% endif %}
    <img src="{{ product.image_url }}" alt="{{ product.image_alt|default:product.name }}" loading="lazy" width="720" height="900">
    <span class="product-discover" aria-hidden="true">View timepiece</span>
  </a>
  <div class="product-info"><div><span class="product-category">{{ product.get_collection_display }} COLLECTION</span><h3><a href="{% url 'shop:product_detail' product.slug %}">{{ product.name }}</a></h3><p>{{ product.short_description }}</p></div><span class="product-price">${{ product.price|floatformat:'2g' }}</span></div>
</article>
